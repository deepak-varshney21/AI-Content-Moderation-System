services:

  # =================================
  # BACKEND - FASTAPI
  # =================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: content_moderation_backend

    ports:
      - "8000:8000"

    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      DEBUG: "false"

      MODEL_NAME: "oleksiizirka/xlm-roberta-toxicity-classifier"

      CORS_ORIGINS: '["http://localhost:3000"]'

      HF_HOME: "/app/.cache/huggingface"

    volumes:
      - ./backend/moderation.db:/app/moderation.db
      - huggingface_cache:/app/.cache/huggingface

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8000/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s


  # =================================
  # FRONTEND - REACT + NGINX
  # =================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: content_moderation_frontend

    ports:
      - "3000:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped


# =================================
# PERSISTENT VOLUMES
# =================================

volumes:
  huggingface_cache: